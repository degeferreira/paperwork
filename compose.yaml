name: silverbullet-paperwork
services:
  silverbullet:
    image: ghcr.io/silverbulletmd/silverbullet:2.11.1-slim@sha256:07dcc90f41eaa258814080bc3f9af47854e56b23ad0c8c7ffc2ac4bc98568a92
    restart: unless-stopped
    ports: ["127.0.0.1:13000:3000"]
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SB_RUNTIME_API: "0"
    volumes:
      - ./runtime/silverbullet:/data
      - ./runtime/space:/space
      - ./libraries/Paperwork:/space/Library/Paperwork:ro
    mem_limit: 384m
    pids_limit: 128
  paperwork:
    build:
      context: ./backend
      args:
        HUB_UID: ${PUID:-1000}
        HUB_GID: ${PGID:-1000}
    init: true
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    network_mode: service:silverbullet
    depends_on: [silverbullet]
    environment:
      PAPERWORK_HOME: /paperwork
      PAPERWORK_CONFIG: /paperwork/config.json
    volumes:
      - ./runtime/paperwork:/paperwork
      - ./runtime/backups:/paperwork-backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 96
